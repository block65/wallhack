name: wallhack-range

services:
  # ===========================================================================
  # PERIMETER 10.99.1.0/24
  # ===========================================================================

  gateway-perimeter:
    build:
      context: ..
      dockerfile: range/images/gateway/Dockerfile
    hostname: gateway-perimeter
    ports:
      - "2222:22"
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      perimeter:
        ipv4_address: 10.99.1.10
      office:
        ipv4_address: 10.99.2.2
    cap_add:
      - NET_ADMIN
    mem_limit: 128m
    cpus: 0.5

  web-external:
    image: nginx:alpine
    hostname: web-external
    networks:
      perimeter:
        ipv4_address: 10.99.1.80
    volumes:
      - ./assets/external:/usr/share/nginx/html:ro
    mem_limit: 64m
    cpus: 0.25

  ftp-server:
    build:
      context: .
      dockerfile: images/ftp/Dockerfile
    hostname: ftp-server
    networks:
      perimeter:
        ipv4_address: 10.99.1.21
    mem_limit: 64m
    cpus: 0.25

  attacker:
    build:
      context: ..
      dockerfile: range/images/attacker/Dockerfile
    hostname: attacker
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      perimeter:
        ipv4_address: 10.99.1.100
    mem_limit: 256m
    cpus: 0.5

  # Corporate HTTP CONNECT proxy
  corp-proxy:
    build:
      context: .
      dockerfile: images/proxy/Dockerfile
    hostname: corp-proxy
    networks:
      perimeter:
        ipv4_address: 10.99.1.50
    mem_limit: 64m
    cpus: 0.25

  # Corporate SOCKS5 proxy
  corp-socks:
    build:
      context: .
      dockerfile: images/socks/Dockerfile
    hostname: corp-socks
    networks:
      perimeter:
        ipv4_address: 10.99.1.51
    mem_limit: 32m
    cpus: 0.25

  # ===========================================================================
  # OFFICE 10.99.2.0/24
  # ===========================================================================

  gateway-office:
    build:
      context: ..
      dockerfile: range/images/gateway/Dockerfile
    hostname: gateway-office
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      office:
        ipv4_address: 10.99.2.10
      datacenter:
        ipv4_address: 10.99.3.2
    cap_add:
      - NET_ADMIN
    mem_limit: 128m
    cpus: 0.5

  fileserver:
    build:
      context: .
      dockerfile: images/samba/Dockerfile
    hostname: fileserver
    environment:
      SAMBA_USER: admin
      SAMBA_PASSWORD: admin123
    networks:
      office:
        ipv4_address: 10.99.2.100
    mem_limit: 128m
    cpus: 0.25

  intranet:
    image: nginx:alpine
    hostname: intranet
    networks:
      office:
        ipv4_address: 10.99.2.80
    volumes:
      - ./assets/intranet:/usr/share/nginx/html:ro
    mem_limit: 64m
    cpus: 0.25

  ssh-server:
    build:
      context: .
      dockerfile: images/ssh/Dockerfile
    hostname: ssh-server
    networks:
      office:
        ipv4_address: 10.99.2.22
    mem_limit: 64m
    cpus: 0.25

  printer:
    build:
      context: .
      dockerfile: images/printer/Dockerfile
    hostname: printer
    volumes:
      - ./images/printer:/app:ro
    networks:
      office:
        ipv4_address: 10.99.2.200
    mem_limit: 64m
    cpus: 0.25

  # ===========================================================================
  # DATACENTER 10.99.3.0/24
  # ===========================================================================

  gateway-datacenter:
    build:
      context: ..
      dockerfile: range/images/gateway/Dockerfile
    hostname: gateway-datacenter
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      datacenter:
        ipv4_address: 10.99.3.10
      management:
        ipv4_address: 10.99.4.2
    cap_add:
      - NET_ADMIN
    mem_limit: 128m
    cpus: 0.5

  db-postgres:
    image: postgres:alpine
    hostname: db-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: production
    networks:
      datacenter:
        ipv4_address: 10.99.3.20
    mem_limit: 256m
    cpus: 0.5

  db-mysql:
    image: mysql:8
    hostname: db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: legacy
    networks:
      datacenter:
        ipv4_address: 10.99.3.21
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:alpine
    hostname: redis
    networks:
      datacenter:
        ipv4_address: 10.99.3.30
    mem_limit: 64m
    cpus: 0.25

  memcached:
    image: memcached:alpine
    hostname: memcached
    networks:
      datacenter:
        ipv4_address: 10.99.3.40
    mem_limit: 64m
    cpus: 0.25

  api-server:
    build:
      context: .
      dockerfile: images/api-server/Dockerfile
    hostname: api-server
    volumes:
      - ./images/api-server:/app:ro
    networks:
      datacenter:
        ipv4_address: 10.99.3.80
    mem_limit: 128m
    cpus: 0.25

  # ===========================================================================
  # MANAGEMENT 10.99.4.0/24
  # ===========================================================================

  gateway-management:
    build:
      context: ..
      dockerfile: range/images/gateway-hardened/Dockerfile
    hostname: gateway-management
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      management:
        ipv4_address: 10.99.4.10
      vault:
        ipv4_address: 10.99.5.2
    cap_add:
      - NET_ADMIN
    mem_limit: 128m
    cpus: 0.5

  monitoring:
    image: prom/prometheus
    hostname: monitoring
    networks:
      management:
        ipv4_address: 10.99.4.80
    mem_limit: 256m
    cpus: 0.5

  logging:
    image: grafana/loki
    hostname: logging
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      management:
        ipv4_address: 10.99.4.90
    mem_limit: 256m
    cpus: 0.25

  ci-server:
    image: mailhog/mailhog:latest
    hostname: ci-server
    networks:
      management:
        ipv4_address: 10.99.4.81
    mem_limit: 128m
    cpus: 0.25

  # ===========================================================================
  # VAULT 10.99.5.0/24
  # ===========================================================================

  secrets-server:
    image: hashicorp/vault:latest
    hostname: secrets-server
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token-for-learning
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      vault:
        ipv4_address: 10.99.5.10
    mem_limit: 256m
    cpus: 0.5

  backup-server:
    build:
      context: .
      dockerfile: images/backup-gateway/Dockerfile
    hostname: backup-server
    networks:
      vault:
        ipv4_address: 10.99.5.20
    mem_limit: 64m
    cpus: 0.25

  gold:
    build:
      context: .
      dockerfile: images/gold/Dockerfile
    hostname: gold
    volumes:
      - ./images/gold:/app:ro
    networks:
      vault:
        ipv4_address: 10.99.5.100
    mem_limit: 64m
    cpus: 0.25

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.1.0/24
          gateway: 10.99.1.254

  office:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.99.2.0/24
          gateway: 10.99.2.254

  datacenter:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.99.3.0/24
          gateway: 10.99.3.254

  management:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.99.4.0/24
          gateway: 10.99.4.254

  vault:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.99.5.0/24
          gateway: 10.99.5.254
