# Wallhack layer — binary from cargo build, config via kernel args
binary: target/musl/x86_64-unknown-linux-musl/release/wallhack -> /usr/local/bin/wallhack
start: |
  WH_CMD="wallhack daemon"
  [ -n "${WH_NAME:-}"    ] && WH_CMD="$WH_CMD --name $WH_NAME"
  [ -n "${WH_ROLE:-}"    ] && WH_CMD="$WH_CMD --fixed-role $WH_ROLE"
  [ -n "${WH_LISTEN:-}"  ] && WH_CMD="$WH_CMD --listen $WH_LISTEN"
  [ -n "${WH_CONNECT:-}" ] && WH_CMD="$WH_CMD --connect $WH_CONNECT"
  $WH_CMD > /tmp/wh.log 2>&1 &
