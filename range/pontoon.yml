version: "1"

build:
  env:
    WALLHACK_BINARY: ../target/x86_64-unknown-linux-musl/release/wallhack

defaults:
  kernel: ./vm/build/vmlinuz
  alpine: "3.21"
  mcp:
    hide_tools:
      - topology_get
      - range_status
    allow_tools:
      - vm_exec
      - vm_exec_bg
      - vm_tail
    allow_binaries:
      - wallhack
    deny_root: true

networks:
  perimeter:
    subnet: 10.99.1.0/24
  office:
    subnet: 10.99.2.0/24
    internal: true
  datacenter:
    subnet: 10.99.3.0/24
    internal: true
  management:
    subnet: 10.99.4.0/24
    internal: true
  vault:
    subnet: 10.99.5.0/24
    internal: true
  proxy-vault:
    subnet: 10.99.6.0/24
    internal: true

services:
  # ===========================================================================
  # PERIMETER 10.99.1.0/24
  # ===========================================================================

  attacker:
    memory: 512m
    cpus: 2
    mcp:
      allow_tools: ["*"]
      allow_binaries: ["*"]
      deny_root: false
    layers:
      - base
      - attacker
      - wallhack
    networks:
      perimeter:
        ipv4_address: 10.99.1.100
    kernel_args:
      svc.start: wallhack
      svc.wallhack.role: entry
      svc.wallhack.name: attacker
      svc.wallhack.listen: ":443"

  gateway-perimeter:
    memory: 128m
    cpus: 2
    layers:
      - base
      - wallhack
      - perimeter-gw
      - ssh-leaked-key
    networks:
      perimeter:
        ipv4_address: 10.99.1.10
      office:
        ipv4_address: 10.99.2.2
        masquerade: true
    kernel_args:
      svc.start: ssh-leaked-key

  web-external:
    memory: 128m
    cpus: 1
    layers:
      - base
      - web-external
    networks:
      perimeter:
        ipv4_address: 10.99.1.80
    kernel_args:
      svc.start: web-external

  web-filter:
    memory: 64m
    cpus: 1
    layers:
      - base-slim
      - egress-web-only
      - wallhack
    networks:
      perimeter:
        ipv4_address: 10.99.1.60

  ftp-server:
    memory: 64m
    cpus: 1
    layers:
      - base
      - vsftpd
      - ftp-loot
    networks:
      perimeter:
        ipv4_address: 10.99.1.21
    kernel_args:
      svc.start: vsftpd

  corp-proxy:
    memory: 128m
    cpus: 1
    layers:
      - base
      - squid
      - wallhack
    networks:
      perimeter:
        ipv4_address: 10.99.1.50
      proxy-vault:
        ipv4_address: 10.99.6.2
    kernel_args:
      svc.start: squid

  corp-socks:
    memory: 64m
    cpus: 1
    layers:
      - base
      - dante
    networks:
      perimeter:
        ipv4_address: 10.99.1.51
    kernel_args:
      svc.start: dante

  # ===========================================================================
  # OFFICE 10.99.2.0/24
  # ===========================================================================

  ssh-bastion:
    memory: 64m
    cpus: 1

    layers:
      - base-slim
      - proxy-env
      - egress-ssh-only
      - ssh-bastion
    networks:
      office:
        ipv4_address: 10.99.2.30
        gateway: 10.99.2.2

  loot:
    memory: 128m
    cpus: 1
    layers:
      - base
      - app-loot
    networks:
      office:
        ipv4_address: 10.99.2.31
        gateway: 10.99.2.30
    kernel_args:
      svc.start: app-loot

  gateway-office:
    memory: 128m
    cpus: 2
    layers:
      - base
      - wallhack
      - vuln-upload
    networks:
      office:
        ipv4_address: 10.99.2.10
      datacenter:
        ipv4_address: 10.99.3.2
        masquerade: true
    kernel_args:
      svc.start: vuln-upload

  fileserver:
    memory: 256m
    cpus: 1
    layers:
      - base
      - proxy-env
      - samba
    networks:
      office:
        ipv4_address: 10.99.2.100
        gateway: 10.99.2.2
    kernel_args:
      svc.start: samba

  intranet:
    memory: 64m
    cpus: 1
    layers:
      - base
      - proxy-env
      - intranet
    networks:
      office:
        ipv4_address: 10.99.2.80
        gateway: 10.99.2.2
    kernel_args:
      svc.start: intranet

  ssh-server:
    memory: 128m
    cpus: 1
    layers:
      - base
      - proxy-env
      - ssh-hardened
    networks:
      office:
        ipv4_address: 10.99.2.22
        gateway: 10.99.2.2
    kernel_args:
      svc.start: ssh-hardened

  printer:
    memory: 256m
    cpus: 1
    layers:
      - base
      - proxy-env
      - app-printer
    networks:
      office:
        ipv4_address: 10.99.2.200
        gateway: 10.99.2.2
    kernel_args:
      svc.start: app-printer

  # ===========================================================================
  # DATACENTER 10.99.3.0/24
  # ===========================================================================

  gateway-datacenter:
    memory: 128m
    cpus: 2
    layers:
      - base
      - wallhack
      - vuln-cron
    networks:
      datacenter:
        ipv4_address: 10.99.3.10
      management:
        ipv4_address: 10.99.4.2
        masquerade: true
    kernel_args:
      svc.start: vuln-cron

  db-postgres:
    memory: 256m
    cpus: 1
    layers:
      - base
      - postgres
    networks:
      datacenter:
        ipv4_address: 10.99.3.20
        gateway: 10.99.3.2
    kernel_args:
      svc.start: postgres

  db-mariadb:
    memory: 768m
    cpus: 1
    layers:
      - base
      - mariadb
    networks:
      datacenter:
        ipv4_address: 10.99.3.21
        gateway: 10.99.3.2
    kernel_args:
      svc.start: mariadb

  redis:
    memory: 64m
    cpus: 1
    layers:
      - base
      - redis
    networks:
      datacenter:
        ipv4_address: 10.99.3.30
        gateway: 10.99.3.2
    kernel_args:
      svc.start: redis

  memcached:
    memory: 64m
    cpus: 1
    layers:
      - base
      - memcached
    networks:
      datacenter:
        ipv4_address: 10.99.3.40
        gateway: 10.99.3.2
    kernel_args:
      svc.start: memcached

  udp-only:
    memory: 64m
    cpus: 1

    layers:
      - base-slim
      - egress-udp53-only
      - wallhack
    networks:
      datacenter:
        ipv4_address: 10.99.3.90
        gateway: 10.99.3.2
    kernel_args:
      svc.start: wallhack
      svc.wallhack.role: exit
      svc.wallhack.name: udp-only
      # connect address scheme for UDP/QUIC transport — requires attacker listening on :53
      svc.wallhack.connect: "10.99.1.100:53"

  api-server:
    memory: 128m
    cpus: 1
    layers:
      - base
      - app-api
    networks:
      datacenter:
        ipv4_address: 10.99.3.80
        gateway: 10.99.3.2
    kernel_args:
      svc.start: app-api

  # ===========================================================================
  # MANAGEMENT 10.99.4.0/24
  # ===========================================================================

  gateway-management:
    memory: 128m
    cpus: 2
    layers:
      - base
      - wallhack
      - ssh-hardened
    networks:
      management:
        ipv4_address: 10.99.4.10
      vault:
        ipv4_address: 10.99.5.2
        masquerade: true
    kernel_args:
      svc.start: ssh-hardened

  monitoring:
    memory: 512m
    cpus: 1
    layers:
      - base
      - prometheus
    networks:
      management:
        ipv4_address: 10.99.4.80
        gateway: 10.99.4.2
    kernel_args:
      svc.start: prometheus

  # ===========================================================================
  # VAULT 10.99.5.0/24
  # ===========================================================================

  reverse-target:
    memory: 64m
    cpus: 1

    layers:
      - base-slim
      - egress-none
      - wallhack
    networks:
      vault:
        ipv4_address: 10.99.5.50
        gateway: 10.99.5.2
    kernel_args:
      svc.start: wallhack
      svc.wallhack.role: exit
      svc.wallhack.name: reverse-target
      # exit listens; attacker (entry) must connect to 10.99.5.50:9000
      svc.wallhack.listen: ":9000"

  backup-server:
    memory: 128m
    cpus: 1
    layers:
      - base
      - backup-ssh
    networks:
      vault:
        ipv4_address: 10.99.5.20
        gateway: 10.99.5.2
    kernel_args:
      svc.start: backup-ssh

  gold:
    memory: 256m
    cpus: 1
    layers:
      - base
      - app-gold
    networks:
      vault:
        ipv4_address: 10.99.5.100
        gateway: 10.99.5.2
    kernel_args:
      svc.start: app-gold

  # ===========================================================================
  # PROXY-VAULT 10.99.6.0/24 — hard mode: only reachable via proxy tunnel
  # ===========================================================================

  platinum:
    memory: 128m
    cpus: 1
    layers:
      - base
      - app-platinum
    networks:
      proxy-vault:
        ipv4_address: 10.99.6.100
        gateway: 10.99.6.2
    kernel_args:
      svc.start: app-platinum
