[package]
name = "wallhack-netstack"
version = "0.1.0"
edition = "2024"

[features]
default = []
async = ["dep:tokio", "smoltcp/async", "dep:tracing"]

[dependencies]
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "alloc",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
] }
thiserror = { workspace = true }
parking_lot = { workspace = true }

tokio = { workspace = true, features = [
    "rt",
    "sync",
    "time",
    "io-util",
    "macros",
], optional = true }

tracing = { workspace = true, optional = true }

[dev-dependencies]
pcap-file = "2"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "test-util",
] }
# deadlock_detection adds ownership tracking to every lock acquisition.
# It is only active in test builds (dev-dependencies), so it has no effect
# on release binaries. Cargo will unify this feature with the workspace
# dependency for the duration of the test compile.
parking_lot = { version = "0.12", features = ["deadlock_detection"] }

[lints]
workspace = true
