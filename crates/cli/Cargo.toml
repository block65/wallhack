[package]
name = "wallhack-cli"
version = "0.8.0"
edition = "2024"

[[bin]]
name = "wallhack"
path = "src/bin/wallhack.rs"

[[bin]]
name = "wallhackctl"
path = "src/bin/wallhack.rs"

[features]
default = ["quic", "websocket", "http-api", "repl"]
slim = ["quic", "websocket"]

# Transport features (forwarded to wallhackd)
quic = ["wallhackd/quic"]
websocket = ["wallhackd/websocket"]
vsock = ["wallhackd/vsock", "wallhack-ipc/vsock"]

# REST API feature (forwarded to wallhackd)
http-api = ["wallhackd/http-api"]

# Interactive REPL
repl = ["dep:reedline", "dep:nu-ansi-term"]

[dependencies]
argh = "0.1"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wallhack-ipc = { path = "../ipc" }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
# Already a transitive dep via reedline — no additional binary cost.
nu-ansi-term = { version = "0.50", optional = true }
reedline = { version = "0.38", optional = true, features = ["external_printer"] }
tabwriter = "1"
thiserror.workspace = true
tokio = { workspace = true, features = [
  "net",
  "io-util",
  "rt-multi-thread",
  "macros",
] }
tracing.workspace = true
wallhack-core = { path = "../core", default-features = false }
wallhack-wire = { path = "../wire" }
wallhackd = { path = "../daemon", default-features = false }
zeroize = "1"

[build-dependencies]
built.workspace = true

[lints]
workspace = true
