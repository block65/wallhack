[package]
name = "wallhack-cli"
version = "0.2.7"
edition = "2024"

[[bin]]
name = "wallhack"
path = "src/bin/wallhack.rs"

[[bin]]
name = "wallhackctl"
path = "src/bin/wallhack.rs"

[features]
default = ["quic", "websocket", "http-api", "repl"]
slim = ["quic", "websocket"]

# Transport features (forwarded to wallhackd)
quic = ["wallhackd/quic"]
websocket = ["wallhackd/websocket"]

# REST API feature (forwarded to wallhackd)
http-api = ["wallhackd/http-api"]

# Interactive REPL
repl = ["dep:reedline"]

[dependencies]
argh = "0.1"
prost = "0.13"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
reedline = { version = "0.38", optional = true, features = ["external_printer"] }
tabwriter = "1"
thiserror.workspace = true
tokio = { workspace = true, features = [
  "net",
  "io-util",
  "rt-multi-thread",
  "macros",
] }
tracing.workspace = true
wallhack-core = { path = "../core", default-features = false }
wallhack-wire = { path = "../wire" }
wallhackd = { path = "../daemon", default-features = false }

[build-dependencies]
built = { version = "0.7", features = ["git2", "chrono"] }

[lints]
workspace = true
