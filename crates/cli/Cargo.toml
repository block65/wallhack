[package]
name = "wallhack-cli"
version = "0.2.6"
edition = "2024"

[features]
default = ["quic", "websocket", "color", "repl", "http-api"]
slim = ["quic", "websocket", "color"]
color = []
repl = ["dep:reedline"]                              # Interactive REPL (history, completion)
tokio-console = ["dep:console-subscriber"]
dns-resolver = ["dep:hickory-resolver"]

# Transport features (forwarded to wallhack-core)
quic = ["wallhack-core/quic"]
websocket = ["wallhack-core/websocket"]

# REST API feature
http-api = ["dep:wallhack-api"]

[dependencies]
anstyle = "1"
anyhow = "1"
argh = "0.1"
derive_more = { version = "2", features = ["display"] }
hickory-resolver = { version = "0.25", default-features = false, features = [
  "tokio",
], optional = true }
wallhack-wire = { path = "../wire" }
prost = "0.13"
quinn = { version = "0.11", default-features = false, features = [
  "runtime-tokio",
  "rustls-ring",
] }
reedline = { version = "0.45", default-features = false, features = ["external_printer"], optional = true }
shlex = "1"
thiserror = "2"
tokio.workspace = true
tracing.workspace = true
wallhack-core = { path = "../core", default-features = false }
wallhack-api = { path = "../api", optional = true }
subtle = "2"
console-subscriber = { workspace = true, optional = true }
rand = { version = "0.9", default-features = false, features = [
  "std",
  "std_rng",
] }
parking_lot = "0.12.5"
tabwriter = "1.4.1"

[build-dependencies]
built = { version = "0.7", features = ["git2", "chrono"] }

[lints]
workspace = true
