[package]
name = "wallhack-transport"
version = "0.1.0"
edition = "2024"
categories = ["network-programming"]

[features]
default = ["quic"]
quic = ["dep:quinn"]
websocket = [
    "dep:bytes",
    "dep:tokio-tungstenite",
    "dep:tokio-util",
    "dep:yamux",
    "dep:base64",
    "dep:sha1",
]
full = ["quic", "websocket"]

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros"] }
tracing = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std"] }

# QUIC transport dependencies (optional)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }

# WebSocket transport dependencies (optional)
base64 = { version = "0.22", default-features = false, features = ["std"], optional = true }
bytes = { version = "1", optional = true }
sha1 = { version = "0.10", default-features = false, features = ["std"], optional = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake", "stream"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["compat"], optional = true }
yamux = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
name = "websocket"
harness = false
required-features = ["websocket"]

[lints]
workspace = true
