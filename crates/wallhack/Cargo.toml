[package]
name = "wallhack"
version = "0.1.2"
edition = "2024"
categories = ["network-programming"]

[features]
default = ["quic", "websocket", "http-api"]
slim = ["quic", "websocket"]
quic = ["dep:quinn", "transport/quic"]
websocket = [
    "dep:tokio-tungstenite",
    "dep:yamux",
    "dep:tokio-rustls",
    "dep:async-http-proxy",
    "dep:tokio-socks",
    "transport/websocket",
]
http-api = [
    "dep:axum",
    "dep:axum-server",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio-stream",
    "dep:urlencoding",
    "dep:base64",
]

[dependencies]
exit_adapter = { path = "../exit-adapter" }
transport = { path = "../transport", default-features = false }
anyhow = "1"
dashmap = "6"
prost = { version = "0.13" }
protobuf = { path = "../protobuf" }
netstack = { path = "../netstack", features = ["async"] }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
], optional = true }
rand = { version = "0.9", default-features = false, features = [
    "std",
    "std_rng",
] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
rustls-pemfile = "2"
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "alloc",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "medium-ip",
    "medium-ethernet",
    "phy-tuntap_interface",
    "proto-ipv4",
    "proto-ipv6",
] }
socket2.version = "0.5"
thiserror = "2"
tokio.features = ["rt", "macros", "rt-multi-thread", "net", "io-util"]
tokio.workspace = true
tracing.workspace = true
tun = { version = "0.7", features = [
    "async",
    "tokio",
], default-features = false }

# WebSocket dependencies still used directly by wallhack client/server
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
], optional = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "handshake",
    "stream",
], optional = true }
yamux = { version = "0.13", default-features = false, optional = true }
async-http-proxy = { version = "1", default-features = false, features = ["runtime-tokio"], optional = true }
tokio-socks = { version = "0.5", optional = true }

# Bridge module dependencies (always needed for transport abstraction)
bytes = "1.11.1"
futures = { version = "0.3", default-features = false, features = ["std"] }

# REST API (optional)
axum = { version = "0.7", default-features = false, features = [
    "tokio",
    "json",
    "http1",
], optional = true }
axum-server = { version = "0.7", default-features = false, features = [
    "tls-rustls",
], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
urlencoding = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
subtle = "2"
ring = { version = "0.17", default-features = false }

[build-dependencies]
test-log = { version = "0.2", features = ["trace"] }

[dev-dependencies]
bytes = "1.11.1"
protobuf = { path = "../protobuf" }
tempfile = "3"
test-log = { version = "0.2", features = ["trace"] }
tokio-test = "0.4"

[lints]
workspace = true
# rust.unsafe_code = "forbid"
