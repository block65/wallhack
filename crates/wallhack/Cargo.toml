[package]
name = "wallhack"
version = "0.1.0"
edition = "2024"
categories = ["network-programming"]

[features]
default = ["quic"]
quic = ["dep:quinn"]
websocket = [
    "dep:tokio-tungstenite",
    "dep:tokio-util",
    "dep:yamux",
    "dep:httparse",
    "dep:sha1",
    "dep:base64",
    "dep:tokio-rustls",
]
full = ["quic", "websocket"]

[dependencies]
agent_adapter = { path = "../agent-adapter" }
anyhow = "1"
dashmap = "6"
prost = { version = "0.13" }
protobuf = { path = "../protobuf" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
smoltcp = { version = "0.12", default-features = false, features = [
  "std",
  "alloc",
  "socket-tcp",
  "socket-udp",
  "socket-icmp",
  "medium-ip",
  "medium-ethernet",
  "phy-tuntap_interface",
  "proto-ipv4",
  "proto-ipv6",
] }
socket2.version = "0.5"
thiserror = "2"
tokio.features = ["rt", "macros", "rt-multi-thread", "net", "io-util"]
tokio.workspace = true
tracing.workspace = true
tun = { version = "0.7", features = [
  "async",
  "tokio",
], default-features = false }

# WebSocket transport dependencies (optional)
base64 = { version = "0.22", default-features = false, features = ["std"], optional = true }
httparse = { version = "1.9", default-features = false, features = ["std"], optional = true }
sha1 = { version = "0.10", default-features = false, features = ["std"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake", "stream"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["compat"], optional = true }
yamux = { version = "0.13", default-features = false, optional = true }

# Bridge module dependencies (always needed for transport abstraction)
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }

[build-dependencies]
test-log = { version = "0.2", features = ["trace"] }

[dev-dependencies]
tempfile = "3"
test-log = { version = "0.2", features = ["trace"] }
tokio-test = "0.4"

[lints]
workspace = true
# rust.unsafe_code = "forbid"
