[package]
name = "wallhack-core"
version = "0.1.3"
edition = "2024"
categories = ["network-programming"]

[features]
default = ["quic", "websocket"]
slim = ["quic", "websocket"]
quic = ["dep:quinn", "wallhack-transport/quic"]
websocket = [
    "dep:tokio-tungstenite",
    "dep:yamux",
    "dep:tokio-rustls",
    "dep:async-http-proxy",
    "dep:tokio-socks",
    "wallhack-transport/websocket",
]

[dependencies]
wallhack-exit-adapter = { path = "../exit-adapter" }
wallhack-transport = { path = "../transport", default-features = false }
anyhow = "1"
dashmap = "6"
prost = { version = "0.13" }
wallhack-wire = { path = "../wire" }
wallhack-netstack = { path = "../netstack", features = ["async"] }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
], optional = true }
rand = { version = "0.9", default-features = false, features = [
    "std",
    "std_rng",
] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
rustls-pemfile = "2"
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "alloc",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "medium-ip",
    "medium-ethernet",
    "phy-tuntap_interface",
    "proto-ipv4",
    "proto-ipv6",
] }
socket2.version = "0.5"
thiserror = "2"
tokio.features = ["rt", "macros", "rt-multi-thread", "net", "io-util"]
tokio.workspace = true
tracing.workspace = true
tun = { version = "0.7", features = [
    "async",
    "tokio",
], default-features = false }

# WebSocket dependencies still used directly by wallhack client/server
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
], optional = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "handshake",
    "stream",
], optional = true }
yamux = { version = "0.13", default-features = false, optional = true }
async-http-proxy = { version = "1", default-features = false, features = ["runtime-tokio"], optional = true }
tokio-socks = { version = "0.5", optional = true }

# Bridge module dependencies (always needed for transport abstraction)
bytes = "1.11.1"
futures = { version = "0.3", default-features = false, features = ["std"] }

ring = { version = "0.17", default-features = false }

[build-dependencies]
test-log = { version = "0.2", features = ["trace"] }

[dev-dependencies]
bytes = "1.11.1"
wallhack-wire = { path = "../wire" }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
test-log = { version = "0.2", features = ["trace"] }
tokio-test = "0.4"

[lints]
workspace = true
# rust.unsafe_code = "forbid"
