syntax = "proto3";

package wallhack.control;

import "proto/data.proto";

// ── Peer control requests/responses (in-band over tunnel) ───────────

message ControlRequest {
  oneof request {
    PingRequest ping = 1;
    StatsRequest stats = 2;
    PeersRequest peers = 3;
    DisconnectRequest disconnect = 4;
    RouteAddRequest route_add = 5;
    RouteDelRequest route_del = 6;
    RouteListRequest route_list = 7;
  }
}

message ControlResponse {
  oneof response {
    PingResponse ping = 1;
    StatsResponse stats = 2;
    PeersResponse peers = 3;
    DisconnectResponse disconnect = 4;
    RouteAddResponse route_add = 5;
    RouteDelResponse route_del = 6;
    RouteListResponse route_list = 7;
    ErrorResponse error = 100;
  }
}

message PingRequest {}
message PingResponse {
  uint64 uptime_ms = 1;
  string version = 2;
  wallhack.data.NodeRole node_role = 3;
}

message StatsRequest {}
message StatsResponse {
  uint64 bytes_in = 1;
  uint64 bytes_out = 2;
  uint64 packets_in = 3;
  uint64 packets_out = 4;
  uint64 active_connections = 5;
  uint64 active_flows = 6;
  uint64 packets_dropped = 7;
}

message PeersRequest {}
message PeersResponse {
  repeated PeerInfo peers = 1;
}

message PeerInfo {
  string name = 1;
  string addr = 2;
  wallhack.data.NodeRole role = 3;
  uint64 connect_time = 4;
  uint64 bytes_transferred = 5;
  double latency_ms = 6;
}

message DisconnectRequest {
  string peer = 1;
}
message DisconnectResponse {
  bool success = 1;
}

message RouteAddRequest {
  string cidr = 1;  // e.g., "10.0.0.0/8"
  string peer = 2;
}
message RouteAddResponse {
  bool success = 1;
  string message = 2;
}

message RouteDelRequest {
  string cidr = 1;
}
message RouteDelResponse {
  bool success = 1;
  string message = 2;
}

message RouteListRequest {}
message RouteListResponse {
  repeated RouteInfo routes = 1;
}

message RouteInfo {
  string cidr = 1;
  string peer = 2;
  uint64 create_time = 3;
}

message ErrorResponse {
  string message = 1;
}

// ── Control stream envelope (bidi stream framing) ───────────────────

// Wrapper for all messages sent over the persistent control bidi stream.
message ControlMessage {
  oneof message {
    wallhack.data.Handshake handshake = 1;
    wallhack.data.Ping ping = 2;
    wallhack.data.Pong pong = 3;
    ControlRequest control_request = 4;
    ControlResponse control_response = 5;
    Disconnect disconnect = 6;
    RoleTransition role_transition = 7;
  }
}

// Sent to signal graceful shutdown of the connection.
message Disconnect {
  string reason = 1;
}

// Announces a role change to the peer. No acknowledgement; propagation is
// implicit — each peer re-evaluates and, if its own role changes, sends its
// own RoleTransition to its peers.
message RoleTransition {
  wallhack.data.NodeRole new_role = 1;
}
