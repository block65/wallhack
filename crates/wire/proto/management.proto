syntax = "proto3";

package wallhack.management;

// === Framing ===
// Length-delimited protobuf over Unix socket / named pipe.
// Same read_length_delimited / write_length_delimited pattern as transport/protocol.rs.

// === Inbound (to daemon) ===
message ManagementRequest {
  uint64 request_id = 1; // assigned by sender, echoed in response
  oneof request {
    PingRequest ping = 2;
    StatusRequest status = 3;
    StatsRequest stats = 4;
    PeersRequest peers = 5;
    RoutesRequest routes = 6;
    AddRouteRequest add_route = 7;
    RemoveRouteRequest remove_route = 8;
    DisconnectPeerRequest disconnect_peer = 9;
    ConnectRequest connect = 10;
    ListenRequest listen = 11;
    DisconnectRequest disconnect = 12;
    ShutdownRequest shutdown = 13;
  }
}

// === Outbound (from daemon) ===
message DaemonMessage {
  oneof message {
    ManagementResponse response = 1;     // correlated to a request
    DaemonNotification notification = 2; // unsolicited push
  }
}

message ManagementResponse {
  uint64 request_id = 1; // echoes the request
  oneof response {
    PingResponse ping = 2;
    StatusResponse status = 3;
    StatsResponse stats = 4;
    PeersResponse peers = 5;
    RoutesResponse routes = 6;
    ConnectResponse connect = 7;
    ListenResponse listen = 8;
    ErrorResponse error = 20;
    OkResponse ok = 21; // for void operations (add_route, disconnect, etc.)
  }
}

message DaemonNotification {
  oneof event {
    PeerConnected peer_connected = 1;
    PeerDisconnected peer_disconnected = 2;
    RouteChanged route_changed = 3;
    TunnelError tunnel_error = 4;
    MetricsSnapshot metrics_snapshot = 5;
    ShuttingDown shutting_down = 6;
  }
}

// ── Request messages ────────────────────────────────────────────────

message PingRequest {
  string peer = 1;  // prefix to match; empty = auto-select sole peer
}

message StatusRequest {}

message StatsRequest {}

message PeersRequest {}

message RoutesRequest {}

message AddRouteRequest {
  string cidr = 1; // e.g., "10.0.0.0/8"
  string peer = 2; // target peer name
}

message RemoveRouteRequest {
  string cidr = 1;
}

message DisconnectPeerRequest {
  string peer = 1;
}

message ConnectRequest {
  string addr = 1; // peer address to connect to
}

message ListenRequest {
  string addr = 1; // address to listen on
}

message DisconnectRequest {}

message ShutdownRequest {}

// ── Response messages ───────────────────────────────────────────────

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_ENTRY = 1;
  NODE_ROLE_EXIT = 2;
}

enum PeerStatus {
  PEER_STATUS_UNSPECIFIED = 0;
  PEER_STATUS_CONNECTED = 1;
  PEER_STATUS_DISCONNECTED = 2;
}

message PingResponse {
  uint64 uptime_ms = 1;
  string version = 2;
  NodeRole node_role = 3;
}

message StatusResponse {
  NodeRole role = 1;
  bool connected = 2;
  string peer_addr = 3;
  reserved 4;
  reserved "capability";
  string listen_addr = 5;
  string version = 6;
  uint64 uptime_ms = 7;
  string package_name = 8;
  bool tun_capable = 9;
  bool listening = 10;
  bool connecting = 11;
}

message StatsResponse {
  uint64 bytes_in = 1;
  uint64 bytes_out = 2;
  uint64 packets_in = 3;
  uint64 packets_out = 4;
  uint64 active_connections = 5;
  uint64 active_flows = 6;
  uint64 packets_dropped = 7;
}

message PeerInfo {
  string name = 1;
  string addr = 2;
  reserved 3;
  reserved "capability";
  PeerStatus status = 4;
  uint64 connected_at_secs = 5;
  uint64 bytes_transferred = 6;
  double latency_ms = 7;
  bool tun_capable = 8;
  bool listening = 9;
  bool connecting = 10;
}

message PeersResponse {
  repeated PeerInfo peers = 1;
}

message RouteEntry {
  string cidr = 1;
  string peer = 2;
  uint64 added_at_secs = 3;
}

message RoutesResponse {
  repeated RouteEntry routes = 1;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PEER_NOT_FOUND = 1;
  ERROR_CODE_ROUTE_NOT_FOUND = 2;
  ERROR_CODE_NOT_SUPPORTED = 3;
  ERROR_CODE_INVALID_ADDRESS = 4;
  ERROR_CODE_ALREADY_CONNECTED = 5;
  ERROR_CODE_ALREADY_LISTENING = 6;
  ERROR_CODE_NOT_CONNECTED = 7;
  ERROR_CODE_INTERNAL = 8;
  ERROR_CODE_PEER_AMBIGUOUS = 9;
}

message OkResponse {}

message ConnectResponse {
  string peer_addr = 1;    // resolved peer address
  string protocol = 2;     // "QUIC" or "WebSocket"
}

message ListenResponse {
  string listen_addr = 1;  // actual bound address (important if port was 0)
  string protocol = 2;     // "QUIC" or "WebSocket"
  string fingerprint = 3;  // certificate fingerprint (SHA-256)
}

// ── Notification messages ───────────────────────────────────────────

message PeerConnected {
  PeerInfo peer = 1;
}

message PeerDisconnected {
  string name = 1;
  string reason = 2;
}

message RouteChanged {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_ADDED = 1;
    ACTION_REMOVED = 2;
  }
  Action action = 1;
  RouteEntry route = 2;
}

message TunnelError {
  string message = 1;
}

message MetricsSnapshot {
  StatsResponse stats = 1;
}

message ShuttingDown {
  string reason = 1;
}
