[package]
name = "repl"
version = "0.1.0"
edition = "2024"

[features]
default = ["color", "readline", "quic"]
color = ["dep:anstyle"]
readline = ["dep:rustyline"]               # Full REPL with history/completion
tokio-console = ["dep:console-subscriber"]
dns-resolver = ["dep:hickory-resolver"]

# Transport features (forwarded to wallhack)
quic = ["wallhack/quic"]
websocket = ["wallhack/websocket"]
full = ["quic", "websocket"]

# REST API feature
api = ["wallhack/api"]

[dependencies]
anstyle = { version = "1", optional = true }
anyhow = "1"
argh = "0.1"
derive_more = { version = "2", features = ["display"] }
hickory-resolver = { version = "0.25", default-features = false, features = [
  "tokio",
], optional = true }
protobuf = { path = "../protobuf" }
prost = "0.13"
quinn = { version = "0.11", default-features = false, features = [
  "runtime-tokio",
  "rustls-ring",
] }
rustyline = { version = "16", features = ["derive"], optional = true }
shlex = "1"
thiserror = "2"
tokio.workspace = true
tracing.workspace = true
wallhack = { path = "../wallhack" }
subtle = "2"
console-subscriber = { workspace = true, optional = true }
rand = { version = "0.9", default-features = false, features = [
  "std",
  "std_rng",
] }
parking_lot = "0.12.5"
tabwriter = "1.4.1"

[build-dependencies]
built = { version = "0.7", features = ["git2", "chrono"] }


[lints]
workspace = true
