name: Pull Request

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-lint-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lint-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (slim)
        run: cargo clippy --all-targets --no-default-features --features slim -- -D warnings

      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-test-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-cargo-

      - name: Test
        run: cargo test

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-build-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-cargo-

      - name: Build (slim)
        run: cargo build --release --target x86_64-unknown-linux-gnu -p cli --no-default-features --features slim

      - name: Check slim binary size
        run: ./bench/check_bloat.sh --no-build --only=slim-glibc

      - name: Build (default)
        run: cargo build --release --target x86_64-unknown-linux-gnu -p cli

      - name: Check default binary size
        run: ./bench/check_bloat.sh --no-build --only=default-glibc
