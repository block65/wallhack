name: CI

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: v0.2.5

jobs:
  lint-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Biome check
        run: pnpm check
        working-directory: website

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-lint-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lint-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (slim)
        run: cargo clippy --all-targets -p wallhack-cli --no-default-features --features slim -- -D warnings

      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings

  test-musl:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo (musl)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/musl/
          key: ${{ runner.os }}-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-musl-cargo-

      - name: Cache cross binary
        id: cache-cross
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ env.CROSS_VERSION }}-x86_64-unknown-linux-musl

      - name: Install cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CROSS_VERSION" --repo cross-rs/cross --pattern 'cross-x86_64-unknown-linux-musl.tar.gz' -D /tmp
          tar xz -C ~/.cargo/bin cross < /tmp/cross-x86_64-unknown-linux-musl.tar.gz

      - name: Test (musl — primary)
        run: CARGO_TARGET_DIR=target/musl cross test --release --target x86_64-unknown-linux-musl

  build-musl:
    needs: [test-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo (musl)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/musl/
          key: ${{ runner.os }}-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-musl-cargo-

      - name: Cache cross binary
        id: cache-cross
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ env.CROSS_VERSION }}-x86_64-unknown-linux-musl

      - name: Install cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CROSS_VERSION" --repo cross-rs/cross --pattern 'cross-x86_64-unknown-linux-musl.tar.gz' -D /tmp
          tar xz -C ~/.cargo/bin cross < /tmp/cross-x86_64-unknown-linux-musl.tar.gz

      - name: Build slim (musl — primary)
        run: CARGO_TARGET_DIR=target/musl cross build --release --target x86_64-unknown-linux-musl -p wallhack-cli --no-default-features --features slim

      - name: Build default (musl — primary)
        run: CARGO_TARGET_DIR=target/musl cross build --release --target x86_64-unknown-linux-musl -p wallhack-cli

      - name: Check slim binary size (musl — primary)
        run: ./bench/check_bloat.sh --no-build --only=slim-musl

      - name: Check default binary size (musl — primary)
        run: ./bench/check_bloat.sh --no-build --only=default-musl

  build-musl-zigbuild:
    needs: [test-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@v1

      - name: Cache cargo (musl-zigbuild)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-musl-zigbuild-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-musl-zigbuild-cargo-

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build slim (musl — zigbuild)
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl -p wallhack-cli --no-default-features --features slim

      - name: Build default (musl — zigbuild)
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl -p wallhack-cli

  test-glibc:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo (glibc)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-glibc-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-glibc-cargo-

      - name: Test (glibc — sanity)
        run: cargo test --release --target x86_64-unknown-linux-gnu

  build-glibc:
    needs: [test-glibc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo (glibc)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-glibc-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-glibc-cargo-

      - name: Build slim (glibc — sanity)
        run: cargo build --release --target x86_64-unknown-linux-gnu -p wallhack-cli --no-default-features --features slim

      - name: Build default (glibc — sanity)
        run: cargo build --release --target x86_64-unknown-linux-gnu -p wallhack-cli

      - name: Check slim binary size (glibc — sanity)
        run: ./bench/check_bloat.sh --no-build --only=slim-glibc

      - name: Check default binary size (glibc — sanity)
        run: ./bench/check_bloat.sh --no-build --only=default-glibc
