name: CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile.cross-musl"
      - "bench/**"
      - ".github/workflows/pr.yml"

concurrency:
  group: pr-rust-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CROSS_VERSION: v0.2.5

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (slim)
        run: cargo clippy --all-targets -p wallhack-cli --no-default-features --features slim -- -D warnings

      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings

  test-musl:
    needs: [lint]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl
          workspaces: . -> target/musl

      - name: Cache cross binary
        id: cache-cross
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ env.CROSS_VERSION }}-x86_64-unknown-linux-musl

      - name: Install cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CROSS_VERSION" --repo cross-rs/cross --pattern 'cross-x86_64-unknown-linux-musl.tar.gz' -D /tmp
          tar xz -C ~/.cargo/bin cross < /tmp/cross-x86_64-unknown-linux-musl.tar.gz

      - uses: docker/setup-buildx-action@v4

      - name: Build and cache cross Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cross-musl
          tags: wallhack-cross:x86_64-unknown-linux-musl
          load: true
          cache-from: type=gha,scope=cross-musl
          cache-to: type=gha,mode=max,scope=cross-musl

      - name: Test (musl — primary)
        run: CARGO_TARGET_DIR=target/musl cross test --release --target x86_64-unknown-linux-musl

  build-musl:
    needs: [test-musl]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl
          workspaces: . -> target/musl

      - name: Cache cross binary
        id: cache-cross
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ env.CROSS_VERSION }}-x86_64-unknown-linux-musl

      - name: Install cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CROSS_VERSION" --repo cross-rs/cross --pattern 'cross-x86_64-unknown-linux-musl.tar.gz' -D /tmp
          tar xz -C ~/.cargo/bin cross < /tmp/cross-x86_64-unknown-linux-musl.tar.gz

      - uses: docker/setup-buildx-action@v4

      - name: Build and cache cross Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cross-musl
          tags: wallhack-cross:x86_64-unknown-linux-musl
          load: true
          cache-from: type=gha,scope=cross-musl
          cache-to: type=gha,mode=max,scope=cross-musl

      - name: Build slim (musl — primary)
        run: CARGO_TARGET_DIR=target/musl cross build --release --target x86_64-unknown-linux-musl -p wallhack-cli --no-default-features --features slim

      - name: Check slim binary size (musl — primary)
        run: ./bench/check_bloat.sh --no-build --only=slim-musl
        continue-on-error: true

      - name: Build default (musl — primary)
        run: CARGO_TARGET_DIR=target/musl cross build --release --target x86_64-unknown-linux-musl -p wallhack-cli

      - name: Check default binary size (musl — primary)
        run: ./bench/check_bloat.sh --no-build --only=default-musl


  test-glibc:
    needs: [lint]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: glibc

      - name: Test (glibc — sanity)
        run: cargo test --release --target x86_64-unknown-linux-gnu

  build-glibc:
    needs: [test-glibc]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: glibc
          save-if: "false"

      - name: Build slim (glibc — sanity)
        run: cargo build --release --target x86_64-unknown-linux-gnu -p wallhack-cli --no-default-features --features slim

      - name: Check slim binary size (glibc — sanity)
        run: ./bench/check_bloat.sh --no-build --only=slim-glibc
        continue-on-error: true

      - name: Build default (glibc — sanity)
        run: cargo build --release --target x86_64-unknown-linux-gnu -p wallhack-cli

      - name: Check default binary size (glibc — sanity)
        run: ./bench/check_bloat.sh --no-build --only=default-glibc
