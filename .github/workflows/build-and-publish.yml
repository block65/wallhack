name: Build and Publish

env:
  CROSS_VERSION: v0.2.5

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to upload binaries to (e.g. wallhack-cli-v0.3.0)"
        required: true

concurrency:
  group: publish-${{ github.event.inputs.tag_name }}

jobs:
  build:
    if: startsWith(github.event.inputs.tag_name, 'wallhack-cli-v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default, slim]
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
        include:
          # Per-target: artifact, cross
          - target: x86_64-unknown-linux-gnu
            artifact: wallhack-linux-x64
          - target: x86_64-unknown-linux-musl
            artifact: wallhack-linux-x64-musl
            cross: true
            custom_image: true
          - target: aarch64-unknown-linux-gnu
            artifact: wallhack-linux-arm64
            cross: true
          # Per-variant: features, suffix
          - variant: default
            features: ""
          - variant: slim
            features: --no-default-features --features slim
            suffix: -slim
          # Per-target+variant: bloat_label
          - target: x86_64-unknown-linux-gnu
            variant: default
            bloat_label: default-glibc
          - target: x86_64-unknown-linux-gnu
            variant: slim
            bloat_label: slim-glibc
          - target: x86_64-unknown-linux-musl
            variant: default
            bloat_label: default-musl
          - target: x86_64-unknown-linux-musl
            variant: slim
            bloat_label: slim-musl

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name }}

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: runner.environment != 'self-hosted'
        with:
          shared-key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Cache cross binary
        if: matrix.cross && runner.environment != 'self-hosted'
        id: cache-cross
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ env.CROSS_VERSION }}-x86_64-unknown-linux-musl

      - name: Install cross
        if: matrix.cross && (runner.environment == 'self-hosted' || steps.cache-cross.outputs.cache-hit != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v cross &>/dev/null; then
            gh release download "$CROSS_VERSION" --repo cross-rs/cross --pattern 'cross-x86_64-unknown-linux-musl.tar.gz' -D /tmp --clobber
            tar xz -C ~/.cargo/bin cross < /tmp/cross-x86_64-unknown-linux-musl.tar.gz
          fi

      - uses: docker/setup-buildx-action@v4
        if: matrix.custom_image

      - name: Build and cache cross Docker image
        if: matrix.custom_image && runner.environment != 'self-hosted'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cross-musl
          tags: wallhack-cross:${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=cross-musl
          cache-to: type=gha,mode=max,scope=cross-musl

      - name: Build cross Docker image
        if: matrix.custom_image && runner.environment == 'self-hosted'
        run: docker build -t wallhack-cross:${{ matrix.target }} -f Dockerfile.cross-musl .

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p wallhack-cli ${{ matrix.features }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p wallhack-cli ${{ matrix.features }}

      - name: Check binary size
        if: matrix.bloat_label
        run: ./bench/check_bloat.sh --no-build --only=${{ matrix.bloat_label }}

      - name: Upload binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          ARTIFACT="${{ matrix.artifact }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/wallhack" "$ARTIFACT"
          gh release upload --clobber "$TAG_NAME" "$ARTIFACT"

  publish:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
