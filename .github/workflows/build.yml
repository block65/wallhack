name: Rust Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        BUILD_PROFILE: [debug, release]
        BUILD_TARGET: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]

    steps:
      - uses: actions/checkout@v4

      - name: Build binaries in "${{ matrix.BUILD_PROFILE }}" mode
        run: cargo build --profile ${{ matrix.BUILD_PROFILE }}

      - name: Run tests in "${{ matrix.BUILD_PROFILE }}" mode
        run: cargo test --profile ${{ matrix.BUILD_PROFILE }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: <my-app>
          path: target/${{ matrix.BUILD_TARGET }}/<my-app>
