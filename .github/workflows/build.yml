name: CI

on:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-validate-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-validate-cargo-

      - name: Check
        run: cargo check --all-features

      - name: Check slim
        run: cargo check --no-default-features

  build:
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-build-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-cargo-

      - name: Build
        run: cargo build --release --features full

      - name: Test
        run: cargo test --features full

      - name: Check binary size
        run: |
          BINARY="target/release/wallhack"
          SIZE=$(stat -c '%s' "$BINARY")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
          echo "Binary size: ${SIZE_MB}MB"
          LIMIT=6291456  # 6MB hard ceiling
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "ERROR: Binary ${SIZE_MB}MB exceeds 6MB limit"
            exit 1
          fi

  clippy:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-clippy-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-cargo-

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

