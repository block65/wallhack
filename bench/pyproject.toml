[project]
name = "wallhack-bench"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pytest>=8.0", "pyroute2>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "infra: network namespace infrastructure (no wallhack)",
    "connect: wallhack entry/exit connection on localhost (no netns)",
    "smoketest: basic tunnel connectivity (no iperf3)",
    "benchmark: performance benchmarks (requires iperf3 and/or ping)",
]
